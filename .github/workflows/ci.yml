name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Web Asset & JavaScript Validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate JavaScript Syntax
        run: |
          node -c script.js

      - name: Verify Web Entrypoint & Stylesheet
        run: |
          test -f index.html || exit 1
          test -f style.css || exit 1
          echo "Web Calculator verified successfully."
